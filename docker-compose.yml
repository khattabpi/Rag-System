networks:
  oran_twin_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  qdrant_storage:
    driver: local
  hf_cache:
    driver: local


services:

  # =========================
  # 1. Qdrant Vector DB
  # =========================
  qdrant-db:
    image: qdrant/qdrant:latest
    container_name: oran_qdrant_db

    networks:
      oran_twin_net:
        ipv4_address: 172.20.0.20

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_storage:/qdrant/storage

    restart: unless-stopped


  # =========================
  # 2. RAG Core API
  # =========================
  rag-core-api:
    build:
      context: .
      dockerfile: ./docker/Dockerfile.api

    container_name: oran_rag_api

    depends_on:
      - qdrant-db

    networks:
      oran_twin_net:
        ipv4_address: 172.20.0.30

    ports:
      - "8000:8000"

    volumes:
      - ./data/source_docs:/app/data/source_docs
      - ./.env:/app/.env
      - hf_cache:/root/.cache/huggingface

    restart: unless-stopped

  # =========================
  # 3. Streamlit GUI
  # =========================
  rag-gui:
    image: python:3.11-slim
    container_name: oran_rag_gui
    working_dir: /app
    volumes:
      - ./gui:/app/gui
    command: >
      bash -c "pip install --no-cache-dir streamlit==1.36.0 requests==2.32.3 &&
      streamlit run gui/app.py --server.port=8501 --server.address=0.0.0.0"
    ports:
      - "8501:8501"
    networks:
      oran_twin_net:
        ipv4_address: 172.20.0.40
    depends_on:
      - rag-core-api
    restart: unless-stopped
